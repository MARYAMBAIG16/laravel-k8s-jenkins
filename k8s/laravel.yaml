apiVersion: apps/v1
kind: Deployment
metadata:
  name: laravel-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: laravel-app
  template:
    metadata:
      labels:
        app: laravel-app
    spec:
      containers:
        - name: laravel
          image: laravel-k8s-jenkins:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 80
          env:
            - name: APP_KEY
              value: "PASTE_YOUR_APP_KEY_HERE"
            - name: APP_ENV
              value: "production"
            - name: APP_DEBUG
              value: "false"
            - name: DB_CONNECTION
              value: "mysql"
            - name: DB_HOST
              value: "mysql"
            - name: DB_PORT
              value: "3306"
            - name: DB_DATABASE
              value: "laravel"
            - name: DB_USERNAME
              value: "laravel"
            - name: DB_PASSWORD
              value: "laravelpass123"
            - name: CACHE_STORE
              value: "file"
            - name: SESSION_DRIVER
              value: "file"
            - name: QUEUE_CONNECTION
              value: "sync"
---
apiVersion: v1
kind: Service
metadata:
  name: laravel-service
spec:
  type: NodePort
  selector:
    app: laravel-app
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
